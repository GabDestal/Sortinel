# Project name is pinned so the existing n8n volume (n8n-local_n8n_data) keeps being used
name: n8n-local

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.7
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      - WEBHOOK_URL=${WEBHOOK_URL:?Set WEBHOOK_URL in .env}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5679/}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows

volumes:
  n8n_data:
